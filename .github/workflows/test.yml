name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m gbcforge --offline --jobs 5 --db /tmp/gbcforge.sqlite3 --out /tmp/content.jsonl
      - run: python -m unittest discover -s tests -v
        working-directory: incubator/GGUFGauge
